    <!-- Hide Netlify badge -->
    <style>
      .netlify-badge,
      [data-netlify-badge],
      a[href*="netlify.com"][title*="Deploys"],
      a[href*="netlify.com"] img[alt*="Netlify"],
      .netlify-identity-widget,
      #netlify-identity-widget,
      a[href*="netlify.com/powered-by"],
      [class*="netlify"],
      div[style*="position: fixed"] a[href*="netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
      }
