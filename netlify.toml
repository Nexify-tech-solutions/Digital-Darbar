[build]
  publish = "dist"
  command = "npm run build"

# Disable Netlify's snippet injection (including the "Powered by Netlify" badge)
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Additional headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# SPA catch-all redirect — serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
