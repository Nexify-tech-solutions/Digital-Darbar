[build]
  publish = "dist"
  command = "npm run build"

# Disable Netlify's snippet injection (including the "Powered by Netlify" badge)
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Additional headers to ensure no badge injection
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
